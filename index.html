<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardiology Decoder</title>
<style>
  body{margin:0;background:#fff;color:#000;font-family:"Arial Narrow",Arial,sans-serif;font-size:17px}
  main{max-width:640px;margin:0 auto;padding:16px}
  .bar{background:#D9D9D9;font-variant:small-caps;font-weight:bold;padding:4px 8px;margin:0 0 10px}
  input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:10px;border:1px solid #000;border-radius:0}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{background:#000;color:#fff;text-align:left;padding:4px 8px;font-variant:small-caps}
  td{padding:5px 8px;vertical-align:top}
  tr:nth-child(even) td{background:#F2F2F2}
  td:first-child{font-weight:bold;white-space:nowrap;width:1%}
  #dec{margin-top:12px}
  #dec div{padding:6px 8px;border:1px solid #000;margin-bottom:6px}
  .g{font-size:14px;color:#444}
  #none{display:none;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="bar">Cardiology Decoder</div>
<input id="q" type="search" placeholder="Acronym, string of acronyms (3VCAD, s/p CABG), or a word…" autofocus autocomplete="off">
<div id="dec"></div>
<table><thead><tr><th>Acronym</th><th>Meaning</th></tr></thead><tbody id="t"></tbody></table>
<div id="none">No match.</div>
</main>
<script src="data.js"></script>
<script>
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const parse=txt=>txt.trim().split("\n").filter(Boolean).map(l=>{const i=l.indexOf("|");return [l.slice(0,i),l.slice(i+1)]});
const D=parse(DICT), P=parse(PARTS);
// lexicon: normalized key -> [meanings]
const LEX={};
D.forEach(([a,m])=>{const k=norm(a);(LEX[k]=LEX[k]||[]).push(m)});
const PLEX={};
P.forEach(([a,m])=>{const k=norm(a);(PLEX[k]=PLEX[k]||[]).push(m)});
for(let n=1;n<=6;n++){PLEX[n+"v"]=[n+"-vessel"];LEX[n+"vd"]=[n+"-vessel disease"];LEX[n+"vcad"]=[n+"-vessel coronary artery disease"];}
PLEX["vd"]=["Vessel disease"]; PLEX["sp"]=["Status post"];LEX["sp"]=["Status post (s/p)"];
const ALL=k=>LEX[k]||PLEX[k];

// split a token into known pieces (fewest pieces; ties favor longer dictionary words)
function segment(w){
  const n=w.length, best=Array(n+1).fill(null); best[0]={c:0,p:[]};
  for(let i=0;i<n;i++){ if(!best[i])continue;
    for(let j=i+1;j<=n;j++){ const k=w.slice(i,j); if(!ALL(k))continue;
      const c=best[i].c+(LEX[k]?1:1.5)+(k.length<2?1:0);
      if(!best[j]||c<best[j].c) best[j]={c,p:best[i].p.concat(k)}; } }
  return best[n]?best[n].p:null;
}
function decodeToken(tok){
  const k=norm(tok); if(!k)return null;
  if(LEX[k]) return {t:tok,exact:LEX[k]};
  const seg=segment(k);
  if(seg&&seg.length>1) return {t:tok,seg:seg.map(s=>[s,(PLEX[s]||LEX[s])[0]])};
  return {t:tok,none:true};
}

const t=document.getElementById("t"),q=document.getElementById("q"),none=document.getElementById("none"),dec=document.getElementById("dec");
function render(){
  const raw=q.value.trim().toLowerCase(), n=norm(raw);
  // decoder strip: only for multi-token input or a miss
  dec.innerHTML="";
  const toks=raw.replace(/s\/p/g,"sp").split(/[\s\/+,;&]+/).filter(Boolean);
  const whole=LEX[n];
  let rows;
  if(raw){
    const score=([a,m])=>{const na=norm(a);
      if(na===n)return 0; if(na.startsWith(n))return 1;
      if(m.toLowerCase().includes(raw))return 2; return 9;};
    rows=D.map(d=>[score(d),d]).filter(x=>x[0]<9).sort((x,y)=>x[0]-y[0]||x[1][0].localeCompare(y[1][0])).map(x=>x[1]);
    // decode when several tokens, or when the single word isn't an exact entry
    if(toks.length>1||!whole){
      const out=toks.map(decodeToken).filter(Boolean);
      const lines=out.map(o=>{
        if(o.exact) return `<b>${esc(o.t)}</b>: ${esc(o.exact.join("; "))}`;
        if(o.seg) return `<b>${esc(o.t)}</b>: ${o.seg.map(([s,m])=>esc(m)).join(" + ")} <span class="g">(best guess: ${o.seg.map(([s])=>s.toUpperCase()).join(" + ")})</span>`;
        return `<b>${esc(o.t)}</b>: <span class="g">not recognized</span>`;
      });
      if(toks.length>1||out.some(o=>o.seg)) lines.forEach(l=>{const d=document.createElement("div");d.innerHTML=l;dec.append(d)});
    }
  } else rows=D;
  const seen=new Set(), grouped=[];
  rows.forEach(([a,m])=>{const g=grouped.find(x=>x[0]===a);g?g[1].push(m):grouped.push([a,[m]])});
  t.innerHTML="";
  grouped.forEach(([a,ms])=>{const tr=document.createElement("tr");
    const c1=document.createElement("td"),c2=document.createElement("td");
    c1.textContent=a;c2.textContent=ms.join("; ");tr.append(c1,c2);t.append(tr);});
  none.style.display=(grouped.length||dec.children.length)?"none":"block";
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
q.addEventListener("input",render);render();
</script>
</body>
</html>
